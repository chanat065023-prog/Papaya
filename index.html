<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อานนท์กิจ - บัญชีรายรับรายจ่าย</title>
<style>
body{
font-family: Arial,sans-serif;
background:#121212;
color:white;
margin:0;
padding:0;
}
header{
background:#0d6b1f;
padding:20px;
font-size:28px;
font-weight:bold;
}
.container{
padding:15px;
}
.card{
background:#1e2b45;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}
input,select,button{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
border-radius:10px;
border:none;
font-size:16px;
}
button{
background:#0d6b1f;
color:white;
font-weight:bold;
cursor:pointer;
}
.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
.summary .box{
background:#18253d;
padding:15px;
border-radius:15px;
}
.expense-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}
th,td{
padding:10px;
border-bottom:1px solid #333;
text-align:left;
font-size:14px;
}
.green{color:#4cff7b;}
.red{color:#ff6666;}
</style>
</head>
<body>

<header>🥭 อานนท์กิจ<br><span style="font-size:16px;">บัญชีรายรับ-รายจ่าย</span></header>

<div class="container">

<div class="card">
<h2>เพิ่มรายการ</h2>

<label>ประเภท</label>
<select id="type">
<option value="income_cash">รายรับ - เงินสด</option>
<option value="income_transfer">รายรับ - โอนเงิน</option>
<option value="expense">รายจ่าย</option>
</select>

<label>หมวดหมู่รายจ่าย</label>
<select id="category">
<option value="ค่ามะละกอ">ค่ามะละกอ</option>
<option value="ค่ารถขนส่งมะละกอ">ค่ารถขนส่งมะละกอ</option>
<option value="ค่าแผง">ค่าแผง</option>
<option value="ค่าแรง">ค่าแรง</option>
<option value="ค่าใช้จ่ายอื่นๆ">ค่าใช้จ่ายอื่นๆ</option>
</select>

<label>จำนวนเงิน</label>
<input type="number" id="amount" placeholder="0">

<label>หมายเหตุ</label>
<input type="text" id="note" placeholder="เช่น ซื้อ 80 กก.">

<label>วันที่</label>
<input type="date" id="date">

<button onclick="addTransaction()">บันทึกรายการ</button>
</div>

<div class="summary">
<div class="box">
<h3>รายรับวันนี้</h3>
<h2 class="green" id="todayIncome">0 บาท</h2>
</div>

<div class="box">
<h3>รายจ่ายวันนี้</h3>
<h2 class="red" id="todayExpense">0 บาท</h2>
</div>

<div class="box">
<h3>กำไรวันนี้</h3>
<h2 id="todayProfit">0 บาท</h2>
</div>

<div class="box">
<h3>กำไรเดือนนี้</h3>
<h2 id="monthProfit">0 บาท</h2>
</div>
</div>

<div class="card">
<h2>ประวัติรายการ</h2>
<table>
<thead>
<tr>
<th>วันที่</th>
<th>รายการ</th>
<th>จำนวน</th>
</tr>
</thead>
<tbody id="history"></tbody>
</table>
</div>

</div>

<script>
let transactions = JSON.parse(localStorage.getItem("papayaData")) || [];

document.getElementById("date").valueAsDate = new Date();

function addTransaction(){
const type = document.getElementById("type").value;
const category = document.getElementById("category").value;
const amount = parseFloat(document.getElementById("amount").value);
const note = document.getElementById("note").value;
const date = document.getElementById("date").value;

if(!amount || amount <= 0){
alert("กรุณาใส่จำนวนเงิน");
return;
}

transactions.push({
type,
category,
amount,
note,
date
});

localStorage.setItem("papayaData", JSON.stringify(transactions));

document.getElementById("amount").value = "";
document.getElementById("note").value = "";

render();
}

function render(){
const history = document.getElementById("history");
history.innerHTML = "";

let todayIncome = 0;
let todayExpense = 0;
let monthIncome = 0;
let monthExpense = 0;

const today = new Date().toISOString().split("T")[0];
const currentMonth = today.substring(0,7);

transactions.reverse().forEach(t=>{

const tr = document.createElement("tr");

let text = "";

if(t.type === "income_cash"){
text = "💵 เงินสด";
}
else if(t.type === "income_transfer"){
text = "📲 โอนเงิน";
}
else{
text = "💸 " + t.category;
}

tr.innerHTML = `
<td>${t.date}</td>
<td>${text}<br><small>${t.note}</small></td>
<td class="${t.type.includes('income') ? 'green' : 'red'}">
${t.type.includes('income') ? '+' : '-'}${t.amount.toLocaleString()} บาท
</td>
`;

history.appendChild(tr);

if(t.date === today){
if(t.type.includes('income')){
todayIncome += t.amount;
}else{
todayExpense += t.amount;
}
}

if(t.date.startsWith(currentMonth)){
if(t.type.includes('income')){
monthIncome += t.amount;
}else{
monthExpense += t.amount;
}
}

});

document.getElementById("todayIncome").innerText =
todayIncome.toLocaleString() + " บาท";

document.getElementById("todayExpense").innerText =
todayExpense.toLocaleString() + " บาท";

document.getElementById("todayProfit").innerText =
(todayIncome - todayExpense).toLocaleString() + " บาท";

document.getElementById("monthProfit").innerText =
(monthIncome - monthExpense).toLocaleString() + " บาท";
}

render();
</script>

</body>
</html>
